<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title description">
  <title id="title">Facebook Web Request Flow</title>
  <desc id="description">A Draw.io-style diagram showing a browser request moving through DNS, internet routing, Facebook servers, application processing, and a database before the response returns.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4f8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#17324d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1976a8"/>
    </marker>
    <marker id="arrow-coral" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#d96c4f"/>
    </marker>
    <style>
      .title { font: 700 32px 'Aptos', 'Segoe UI', sans-serif; fill: #17324d; }
      .subtitle { font: 400 16px 'Aptos', 'Segoe UI', sans-serif; fill: #587084; }
      .lane { font: 700 13px 'Aptos', 'Segoe UI', sans-serif; letter-spacing: 1.6px; fill: #587084; }
      .node-title { font: 700 18px 'Aptos', 'Segoe UI', sans-serif; fill: #17324d; }
      .node-copy { font: 400 14px 'Aptos', 'Segoe UI', sans-serif; fill: #587084; }
      .step { font: 700 13px 'Aptos', 'Segoe UI', sans-serif; fill: #ffffff; }
      .edge-label { font: 600 13px 'Aptos', 'Segoe UI', sans-serif; fill: #1976a8; }
      .response-label { font: 600 13px 'Aptos', 'Segoe UI', sans-serif; fill: #b45138; }
    </style>
  </defs>

  <rect width="1600" height="700" fill="url(#canvas)"/>
  <rect x="36" y="28" width="1528" height="644" rx="18" fill="#ffffff" stroke="#d8e3ea"/>
  <text x="80" y="88" class="title">Facebook Web Request Flow</text>
  <text x="80" y="118" class="subtitle">How a page request moves from the browser to Facebook's backend and returns as an HTTP response</text>

  <rect x="80" y="162" width="1440" height="190" rx="14" fill="#f5f9fc" stroke="#dbe7ed"/>
  <rect x="80" y="390" width="1440" height="190" rx="14" fill="#fff8f5" stroke="#f0d9d0"/>
  <text x="112" y="198" class="lane">REQUEST PATH</text>
  <text x="112" y="426" class="lane" fill="#b45138">RESPONSE PATH</text>

  <line x1="280" y1="270" x2="314" y2="270" stroke="#1976a8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="514" y1="270" x2="548" y2="270" stroke="#1976a8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="748" y1="270" x2="782" y2="270" stroke="#1976a8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="982" y1="270" x2="1016" y2="270" stroke="#1976a8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="1216" y1="270" x2="1250" y2="270" stroke="#1976a8" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <g filter="url(#shadow)">
    <rect x="100" y="214" width="180" height="112" rx="12" fill="#e7f3fa" stroke="#8bc6df" stroke-width="2"/>
    <rect x="334" y="214" width="180" height="112" rx="12" fill="#eaf7f2" stroke="#8bcdb6" stroke-width="2"/>
    <rect x="568" y="214" width="180" height="112" rx="12" fill="#fff5dc" stroke="#e4c477" stroke-width="2"/>
    <rect x="802" y="214" width="180" height="112" rx="12" fill="#eaf0fb" stroke="#9bb5df" stroke-width="2"/>
    <rect x="1036" y="214" width="180" height="112" rx="12" fill="#f4ebfa" stroke="#c3a1d4" stroke-width="2"/>
    <rect x="1270" y="214" width="180" height="112" rx="12" fill="#fff0ed" stroke="#e7a18e" stroke-width="2"/>
  </g>

  <circle cx="124" cy="238" r="15" fill="#1976a8"/><text x="124" y="243" text-anchor="middle" class="step">1</text>
  <circle cx="358" cy="238" r="15" fill="#23866a"/><text x="358" y="243" text-anchor="middle" class="step">2</text>
  <circle cx="592" cy="238" r="15" fill="#b1841d"/><text x="592" y="243" text-anchor="middle" class="step">3</text>
  <circle cx="826" cy="238" r="15" fill="#496fae"/><text x="826" y="243" text-anchor="middle" class="step">4</text>
  <circle cx="1060" cy="238" r="15" fill="#8b5aa5"/><text x="1060" y="243" text-anchor="middle" class="step">5</text>
  <circle cx="1294" cy="238" r="15" fill="#c45d42"/><text x="1294" y="243" text-anchor="middle" class="step">6</text>

  <text x="190" y="260" text-anchor="middle" class="node-title">Browser</text>
  <text x="190" y="285" text-anchor="middle" class="node-copy">Sends an HTTP request</text>
  <text x="190" y="305" text-anchor="middle" class="node-copy">for a Facebook page</text>
  <text x="424" y="260" text-anchor="middle" class="node-title">DNS Resolver</text>
  <text x="424" y="285" text-anchor="middle" class="node-copy">Finds the IP address</text>
  <text x="424" y="305" text-anchor="middle" class="node-copy">for facebook.com</text>
  <text x="658" y="260" text-anchor="middle" class="node-title">Internet</text>
  <text x="658" y="285" text-anchor="middle" class="node-copy">Routes the request</text>
  <text x="658" y="305" text-anchor="middle" class="node-copy">to Facebook's network</text>
  <text x="892" y="260" text-anchor="middle" class="node-title">Web Server</text>
  <text x="892" y="285" text-anchor="middle" class="node-copy">Receives and forwards</text>
  <text x="892" y="305" text-anchor="middle" class="node-copy">the incoming request</text>
  <text x="1126" y="260" text-anchor="middle" class="node-title">Application</text>
  <text x="1126" y="285" text-anchor="middle" class="node-copy">Processes permissions</text>
  <text x="1126" y="305" text-anchor="middle" class="node-copy">and page logic</text>
  <text x="1360" y="260" text-anchor="middle" class="node-title">Database</text>
  <text x="1360" y="285" text-anchor="middle" class="node-copy">Returns posts, profile</text>
  <text x="1360" y="305" text-anchor="middle" class="node-copy">and page content</text>

  <path d="M1360 520 C1360 560 1180 560 1126 520 C1070 478 1000 478 892 520 C780 564 630 564 424 520 C330 500 250 500 190 520" fill="none" stroke="#d96c4f" stroke-width="3" marker-end="url(#arrow-coral)"/>
  <text x="800" y="548" text-anchor="middle" class="response-label">HTTP response: data and page assets return to the browser</text>

  <text x="80" y="625" class="subtitle">The complete cycle combines name resolution, network routing, application logic, data access, and browser rendering.</text>
</svg>
