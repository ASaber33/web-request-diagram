<svg width="1400" height="760" viewBox="0 0 1400 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1d4ed8"/>
    </marker>
    <style>
      .title { font: 700 36px Arial, sans-serif; fill: #1e293b; }
      .subtitle { font: 600 18px Arial, sans-serif; fill: #4b5563; font-style: italic; }
      .box { fill: #eef6ff; stroke: #9ec5ff; stroke-width: 2; }
      .greenbox { fill: #edf9f0; stroke: #9ad7a8; stroke-width: 2; }
      .label { font: 700 22px Arial, sans-serif; fill: #1e293b; }
      .small { font: 500 16px Arial, sans-serif; fill: #475569; }
      .step { font: 700 14px Arial, sans-serif; fill: #1d4ed8; }
      .arrow { stroke: #1d4ed8; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #6b7280; stroke-width: 2; stroke-dasharray: 8 8; fill: none; }
    </style>
  </defs>

  <rect width="1400" height="760" fill="#f3f4f6"/>

  <text x="700" y="65" text-anchor="middle" class="title">Request Flow for My Facebook Page</text>
  <text x="700" y="98" text-anchor="middle" class="subtitle">How the browser loads a Facebook page</text>

  <path class="dashed" d="M90 120 H1310"/>

  <rect class="box" x="120" y="170" width="180" height="120" rx="16"/>
  <text x="210" y="225" text-anchor="middle" class="label">Browser</text>
  <text x="210" y="252" text-anchor="middle" class="small">My device</text>

  <rect class="box" x="350" y="170" width="200" height="120" rx="16"/>
  <text x="450" y="225" text-anchor="middle" class="label">DNS Resolver</text>
  <text x="450" y="252" text-anchor="middle" class="small">Finds IP address</text>

  <rect class="box" x="600" y="170" width="180" height="120" rx="16"/>
  <text x="690" y="225" text-anchor="middle" class="label">Internet</text>
  <text x="690" y="252" text-anchor="middle" class="small">Routing</text>

  <rect class="box" x="830" y="170" width="220" height="120" rx="16"/>
  <text x="940" y="225" text-anchor="middle" class="label">Facebook Server</text>
  <text x="940" y="252" text-anchor="middle" class="small">Receives request</text>

  <path class="arrow" d="M300 230 L350 230"/>
  <text x="320" y="214" class="step">1</text>

  <path class="arrow" d="M550 230 L600 230"/>
  <text x="570" y="214" class="step">2</text>

  <path class="arrow" d="M780 230 L830 230"/>
  <text x="803" y="214" class="step">3</text>

  <path class="arrow" d="M940 290 L940 430"/>
  <text x="952" y="365" class="step">4</text>

  <rect class="greenbox" x="470" y="430" width="250" height="130" rx="16"/>
  <text x="595" y="485" text-anchor="middle" class="label">Application Layer</text>
  <text x="595" y="512" text-anchor="middle" class="small">Processes request</text>

  <rect class="greenbox" x="760" y="430" width="220" height="130" rx="16"/>
  <text x="870" y="485" text-anchor="middle" class="label">Database</text>
  <text x="870" y="512" text-anchor="middle" class="small">Reads profile data</text>

  <path class="arrow" d="M940 430 L940 560"/>
  <text x="952" y="537" class="step">5</text>

  <path class="arrow" d="M760 495 L720 495"/>
  <text x="740" y="480" class="step">6</text>

  <path class="arrow" d="M470 495 L370 495"/>
  <text x="410" y="480" class="step">7</text>

  <path class="arrow" d="M160 290 L160 570 L230 570"/>
  <text x="136" y="460" class="step">8</text>

  <rect class="box" x="120" y="570" width="260" height="110" rx="16"/>
  <text x="250" y="620" text-anchor="middle" class="label">HTTP Response</text>
  <text x="250" y="648" text-anchor="middle" class="small">HTML / JSON</text>

  <path class="dashed" d="M100 120 L100 610"/>
  <path class="dashed" d="M1270 120 L1270 610"/>
</svg>
