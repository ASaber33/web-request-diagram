<svg width="1400" height="760" viewBox="0 0 1400 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="nodeBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eaf2ff"/>
    </linearGradient>
    <linearGradient id="nodeGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 32px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 600 16px Arial, sans-serif; fill: #475569; }
      .box { fill: url(#nodeBlue); stroke: #bfdbfe; stroke-width: 2; filter: url(#shadow); }
      .greenbox { fill: url(#nodeGreen); stroke: #86efac; stroke-width: 2; filter: url(#shadow); }
      .label { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 15px Arial, sans-serif; fill: #475569; }
      .step { font: 700 13px Arial, sans-serif; fill: #1d4ed8; }
      .arrow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .plain-arrow { stroke: #94a3b8; stroke-width: 2.5; fill: none; marker-end: url(#arrow); stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect width="1400" height="760" fill="url(#bg)"/>

  <text x="700" y="60" text-anchor="middle" class="title">Request Flow for My Facebook Page</text>
  <text x="700" y="90" text-anchor="middle" class="subtitle">How the browser loads a Facebook page</text>

  <rect class="box" x="60" y="150" width="180" height="120" rx="18"/>
  <text x="150" y="202" text-anchor="middle" class="label">Browser</text>
  <text x="150" y="228" text-anchor="middle" class="small">My device</text>

  <rect class="box" x="290" y="150" width="190" height="120" rx="18"/>
  <text x="385" y="202" text-anchor="middle" class="label">DNS Resolver</text>
  <text x="385" y="228" text-anchor="middle" class="small">Finds IP address</text>

  <rect class="box" x="530" y="150" width="180" height="120" rx="18"/>
  <text x="620" y="202" text-anchor="middle" class="label">Internet</text>
  <text x="620" y="228" text-anchor="middle" class="small">Routing</text>

  <rect class="box" x="760" y="150" width="220" height="120" rx="18"/>
  <text x="870" y="202" text-anchor="middle" class="label">Facebook Server</text>
  <text x="870" y="228" text-anchor="middle" class="small">Receives request</text>

  <rect class="greenbox" x="480" y="390" width="240" height="130" rx="18"/>
  <text x="600" y="448" text-anchor="middle" class="label">Application Layer</text>
  <text x="600" y="474" text-anchor="middle" class="small">Processes request</text>

  <rect class="greenbox" x="790" y="390" width="220" height="130" rx="18"/>
  <text x="900" y="448" text-anchor="middle" class="label">Database</text>
  <text x="900" y="474" text-anchor="middle" class="small">Reads profile data</text>

  <rect class="box" x="170" y="600" width="260" height="110" rx="18"/>
  <text x="300" y="655" text-anchor="middle" class="label">HTTP Response</text>
  <text x="300" y="681" text-anchor="middle" class="small">HTML / JSON</text>

  <path class="arrow" d="M240 210 L290 210"/>
  <text x="264" y="198" class="step">1</text>

  <path class="arrow" d="M480 210 L530 210"/>
  <text x="501" y="198" class="step">2</text>

  <path class="arrow" d="M710 210 L760 210"/>
  <text x="732" y="198" class="step">3</text>

  <path class="arrow" d="M870 270 L870 390"/>
  <text x="880" y="332" class="step">4</text>

  <path class="arrow" d="M760 455 L720 455"/>
  <text x="738" y="442" class="step">5</text>

  <path class="arrow" d="M720 510 L790 510"/>
  <text x="753" y="498" class="step">6</text>

  <path class="arrow" d="M600 520 L600 600"/>
  <text x="611" y="568" class="step">7</text>

  <path class="arrow" d="M430 655 L170 655"/>
  <text x="300" y="641" class="step">8</text>

  <path class="plain-arrow" d="M150 150 L150 110 L1000 110 L1000 150"/>
  <text x="540" y="96" class="step">Request flow</text>
</svg>
