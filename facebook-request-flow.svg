<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1000" viewBox="0 0 2200 1000" role="img" aria-labelledby="title description">
  <title id="title">Facebook Request Flow</title>
  <desc id="description">The request and response journey from a user entering Facebook in a browser through DNS, networking, Facebook servers, application processing, and database access.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#edf3f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity="0.14"/></filter>
    <marker id="request-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1976a8"/></marker>
    <marker id="response-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#d96c4f"/></marker>
    <style>
      .title{font:700 34px 'Aptos','Segoe UI',sans-serif;fill:#17324d}.subtitle{font:400 17px 'Aptos','Segoe UI',sans-serif;fill:#587084}.section{font:700 15px 'Aptos','Segoe UI',sans-serif;letter-spacing:1.5px;fill:#466174}.node{font:700 17px 'Aptos','Segoe UI',sans-serif;fill:#17324d}.copy{font:400 14px 'Aptos','Segoe UI',sans-serif;fill:#587084}.label{font:600 13px 'Aptos','Segoe UI',sans-serif;fill:#176d9d}.response-label{font:600 13px 'Aptos','Segoe UI',sans-serif;fill:#b45138}
    </style>
  </defs>
  <rect width="2200" height="1000" fill="url(#background)"/>
  <rect x="32" y="28" width="2136" height="944" rx="20" fill="#fff" stroke="#d8e3ea" stroke-width="2"/>
  <text x="80" y="88" class="title">Facebook Request Flow</text>
  <text x="80" y="120" class="subtitle">From entering https://www.facebook.com to the rendered page</text>

  <rect x="70" y="160" width="2060" height="265" rx="16" fill="#f5f9fc" stroke="#d6e5ec" stroke-width="2"/>
  <text x="104" y="198" class="section">REQUEST FLOW</text>

  <rect x="70" y="485" width="2060" height="265" rx="16" fill="#fff8f5" stroke="#f0d9d0" stroke-width="2"/>
  <text x="104" y="523" class="section">RESPONSE FLOW</text>

  <g stroke="#1976a8" stroke-width="3" fill="none" marker-end="url(#request-arrow)">
    <line x1="260" y1="315" x2="290" y2="315"/><line x1="450" y1="315" x2="480" y2="315"/><line x1="640" y1="315" x2="670" y2="315"/><line x1="830" y1="315" x2="860" y2="315"/><line x1="1020" y1="315" x2="1050" y2="315"/><line x1="1210" y1="315" x2="1240" y2="315"/><line x1="1400" y1="315" x2="1430" y2="315"/><line x1="1590" y1="315" x2="1620" y2="315"/><line x1="1810" y1="315" x2="1840" y2="315"/><line x1="2030" y1="315" x2="2060" y2="315"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="90" y="260" width="170" height="110" rx="12" fill="#e7f3fa" stroke="#8bc6df" stroke-width="2"/>
    <rect x="290" y="260" width="160" height="110" rx="12" fill="#e7f3fa" stroke="#8bc6df" stroke-width="2"/>
    <rect x="480" y="260" width="160" height="110" rx="12" fill="#eaf7f2" stroke="#8bcdb6" stroke-width="2"/>
    <rect x="670" y="260" width="160" height="110" rx="12" fill="#eaf7f2" stroke="#8bcdb6" stroke-width="2"/>
    <rect x="860" y="260" width="160" height="110" rx="12" fill="#eaf7f2" stroke="#8bcdb6" stroke-width="2"/>
    <rect x="1050" y="260" width="160" height="110" rx="12" fill="#fff5dc" stroke="#e4c477" stroke-width="2"/>
    <rect x="1240" y="260" width="160" height="110" rx="12" fill="#fff5dc" stroke="#e4c477" stroke-width="2"/>
    <rect x="1430" y="260" width="160" height="110" rx="12" fill="#fff5dc" stroke="#e4c477" stroke-width="2"/>
    <rect x="1620" y="260" width="190" height="110" rx="12" fill="#f4ebfa" stroke="#c3a1d4" stroke-width="2"/>
    <rect x="1840" y="260" width="190" height="110" rx="12" fill="#f4ebfa" stroke="#c3a1d4" stroke-width="2"/>
    <rect x="2060" y="260" width="70" height="110" rx="12" fill="#fff0ed" stroke="#e7a18e" stroke-width="2"/>
  </g>

  <text x="175" y="306" text-anchor="middle" class="node">User</text><text x="175" y="333" text-anchor="middle" class="copy">Enters URL</text>
  <text x="370" y="299" text-anchor="middle" class="node">Web Browser</text><text x="370" y="326" text-anchor="middle" class="copy">Client</text><text x="370" y="348" text-anchor="middle" class="copy">Presses Enter</text>
  <text x="560" y="306" text-anchor="middle" class="node">DNS Resolver</text><text x="560" y="333" text-anchor="middle" class="copy">Starts lookup</text>
  <text x="750" y="306" text-anchor="middle" class="node">DNS Server</text><text x="750" y="333" text-anchor="middle" class="copy">Resolves domain</text>
  <text x="940" y="306" text-anchor="middle" class="node">IP Address</text><text x="940" y="333" text-anchor="middle" class="copy">Destination found</text>
  <text x="1130" y="299" text-anchor="middle" class="node">Internet</text><text x="1130" y="326" text-anchor="middle" class="copy">Routers</text><text x="1130" y="348" text-anchor="middle" class="copy">Route packets</text>
  <text x="1320" y="299" text-anchor="middle" class="node">TCP</text><text x="1320" y="326" text-anchor="middle" class="copy">Connection</text>
  <text x="1510" y="299" text-anchor="middle" class="node">TLS</text><text x="1510" y="326" text-anchor="middle" class="copy">HTTPS encryption</text>
  <text x="1715" y="299" text-anchor="middle" class="node">Facebook</text><text x="1715" y="326" text-anchor="middle" class="copy">Web Server</text>
  <text x="1935" y="299" text-anchor="middle" class="node">Application</text><text x="1935" y="326" text-anchor="middle" class="copy">Backend Server</text>
  <text x="2095" y="323" text-anchor="middle" class="node" transform="rotate(-90 2095 323)">Database</text>

  <g filter="url(#shadow)">
    <rect x="1640" y="585" width="200" height="110" rx="12" fill="#fff0ed" stroke="#e7a18e" stroke-width="2"/>
    <rect x="1390" y="585" width="200" height="110" rx="12" fill="#fff0ed" stroke="#e7a18e" stroke-width="2"/>
    <rect x="1140" y="585" width="200" height="110" rx="12" fill="#fff0ed" stroke="#e7a18e" stroke-width="2"/>
    <rect x="890" y="585" width="200" height="110" rx="12" fill="#fff0ed" stroke="#e7a18e" stroke-width="2"/>
    <rect x="640" y="585" width="200" height="110" rx="12" fill="#fff0ed" stroke="#e7a18e" stroke-width="2"/>
    <rect x="390" y="585" width="200" height="110" rx="12" fill="#fff0ed" stroke="#e7a18e" stroke-width="2"/>
  </g>
  <g stroke="#d96c4f" stroke-width="3" fill="none" marker-end="url(#response-arrow)">
    <path d="M2095 370 V540 H1740 V585"/><line x1="1640" y1="640" x2="1590" y2="640"/><line x1="1390" y1="640" x2="1340" y2="640"/><line x1="1140" y1="640" x2="1090" y2="640"/><line x1="890" y1="640" x2="840" y2="640"/><line x1="640" y1="640" x2="590" y2="640"/>
  </g>
  <text x="1740" y="630" text-anchor="middle" class="node">Application Server</text><text x="1740" y="658" text-anchor="middle" class="copy">Builds response</text>
  <text x="1490" y="630" text-anchor="middle" class="node">Web Server</text><text x="1490" y="658" text-anchor="middle" class="copy">Sends response</text>
  <text x="1240" y="630" text-anchor="middle" class="node">HTTPS Response</text><text x="1240" y="658" text-anchor="middle" class="copy">Encrypted data</text>
  <text x="990" y="630" text-anchor="middle" class="node">Browser</text><text x="990" y="658" text-anchor="middle" class="copy">Receives response</text>
  <text x="740" y="630" text-anchor="middle" class="node">Rendered Page</text><text x="740" y="658" text-anchor="middle" class="copy">Facebook content</text>
  <text x="490" y="630" text-anchor="middle" class="node">User sees</text><text x="490" y="658" text-anchor="middle" class="copy">the returned page</text>

  <text x="1100" y="820" text-anchor="middle" class="response-label">Response direction: database data -> application -> web server -> HTTPS -> browser -> rendered page</text>
  <text x="80" y="900" class="subtitle">DNS resolves the domain; it does not carry the HTTPS request. The browser never connects directly to the database.</text>
</svg>
